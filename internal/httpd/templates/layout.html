{{define "layout"}}<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{if .Title}}{{.Title}} · {{end}}gitelab</title>
<style>
:root{--bg:#0f1115;--fg:#d7dae0;--muted:#8a8f98;--acc:#4c8dff;--border:#262b33;--err:#ff6b6b;--card:#171b22}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--border)}
.brand{font-weight:700;color:var(--fg);font-size:18px}
header nav{margin-left:auto;display:flex;gap:14px;align-items:center}
main{max-width:960px;margin:24px auto;padding:0 20px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
input,textarea{background:var(--card);border:1px solid var(--border);color:var(--fg);padding:6px 8px;border-radius:6px}
button{background:var(--acc);border:0;color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer}
form.inline{display:inline}
.error{color:var(--err)}
.muted{color:var(--muted)}
.badge{border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:12px;color:var(--muted)}
pre{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto}
code{background:var(--card);padding:2px 6px;border-radius:4px}
.card{border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:16px}
ul.tree{list-style:none;padding-left:0}
ul.tree li{padding:3px 0}
</style>
</head>
<body>
<header>
<a class="brand" href="/">gitelab</a>
{{if .User}}
<nav>
<a href="/repos">Dépôts</a>
{{if .User.IsAdmin}}<a href="/admin/users">Admin</a>{{end}}
<a href="/settings">@{{.User.Username}}</a>
<form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button type="submit">Déconnexion</button></form>
</nav>
{{end}}
</header>
<main>{{template "content" .}}</main>
</body>
</html>
{{end}}
